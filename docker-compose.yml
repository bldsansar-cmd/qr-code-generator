services:
  db:
    image: postgres:16-alpine
    container_name: qrazy-db
    environment:
      POSTGRES_DB: qrazy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - qrazy-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qrazy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qrazy-db-data:
